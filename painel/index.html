<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Potencial CFTV</title>
  <meta name="description" content="Monitoramento centralizado dos DVRs e câmeras das lojas do Grupo Potencial.">
  <meta name="theme-color" content="#071326">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23168cff'/%3E%3Cpath d='M5 9h9l4-2v8l-4-2H5z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11l5-3v12l-5-3H3z"/><circle cx="8" cy="11" r="1.5"/></svg>
        </div>
        <div class="brand-name"><b>Grupo Potencial</b><span>CFTV • Monitoramento Central</span></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn icon ghost menu-btn" id="menuBtn" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 id="pageTitle">Monitoramento CFTV</h1>
          <div class="sub" id="pageSub"></div>
        </div>
        <div class="spacer"></div>
        <span class="muted hide-sm" id="refreshInfo" style="font-size:12px"></span>
        <span class="seal hide-sm"><i id="sealDot"></i> Painel Potencial</span>
      </header>
      <main class="content" id="content">
        <div class="empty"><span class="spin"></span> Carregando…</div>
      </main>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
